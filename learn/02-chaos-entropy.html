 var KEY='lsdh-learn-key:'+D.salt;
 function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
 function show(txt){var go=function(){document.open();document.write(txt);document.close();};if(document.readyState==='complete')setTimeout(go,0);else window.addEventListener('load',function(){setTimeout(go,0);});}
 async function tryKey(raw){
   var key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
   var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.ct));
   return new TextDecoder().decode(pt);
 }
 async function derive(pw){
   var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
   var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(D.salt),iterations:D.iter,hash:'SHA-256'},base,256);
   return new Uint8Array(bits);
 }
 function enc(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
 function stored(){try{return sessionStorage.getItem(KEY)||localStorage.getItem(KEY);}catch(e){return null;}}
 if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='This browser cannot unlock the page here (a secure https:// connection is required).';return;}
 var s=stored();
 if(s){tryKey(b64(s)).then(show).catch(function(){try{sessionStorage.removeItem(KEY);localStorage.removeItem(KEY);}catch(e){}});}
 document.getElementById('f').addEventListener('submit',async function(e){
   e.preventDefault();var err=document.getElementById('err');err.textContent='Unlocking…';
   try{
     var raw=await derive(document.getElementById('pw').value);
     var txt=await tryKey(raw);
     try{sessionStorage.setItem(KEY,enc(raw));if(document.getElementById('rem').checked)localStorage.setItem(KEY,enc(raw));}catch(e){}
     show(txt);
   }catch(x){err.textContent='That passcode did not work. Please try again.';}
 });
})();
